service: serverless-document-processor

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1

  environment:
    DOCUMENTS_BUCKET: ${env:DOCUMENTS_BUCKET}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${env:DOCUMENTS_BUCKET}/*

functions:
  http:
    handler: src/infrastructure/lambda/http.handler
    events:
      - httpApi:
          path: /documents
          method: POST

      - httpApi:
          path: /documents/{id}
          method: GET

      - httpApi:
          path: /documents/{id}
          method: DELETE

plugins:
  - serverless-offline
